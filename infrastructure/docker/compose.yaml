# Stack de desarrollo de VetCat.
#
#   1. Copy-Item infrastructure\docker\.env.example infrastructure\docker\.env
#   2. docker compose -f infrastructure\docker\compose.yaml up -d
#
# Ningún valor de conexión, dominio ni credencial vive aquí: todo sale de `.env`,
# que está ignorado por git. pgAdmin no arranca con `up -d`; se pide con
# `--profile admin`. Ver docs/Despliegue_y_operacion.md §3 y §4.
name: vetcat

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      VETCAT_DB: ${VETCAT_DB}
      VETCAT_DB_USER: ${VETCAT_DB_USER}
      VETCAT_DB_PASSWORD: ${VETCAT_DB_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Crea los dos roles y las dos bases. Idempotente: se puede repetir sin
  # volumen nuevo, a diferencia de un script de /docker-entrypoint-initdb.d.
  postgres-init:
    image: postgres:17.11-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_SUPERUSER}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      VETCAT_DB: ${VETCAT_DB}
      VETCAT_DB_USER: ${VETCAT_DB_USER}
      VETCAT_DB_PASSWORD: ${VETCAT_DB_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./postgres/init.sql:/sql/init.sql:ro
    command:
      - sh
      - -c
      - >-
        exec psql -v ON_ERROR_STOP=1 --dbname=postgres
        -v vetcat_user="$$VETCAT_DB_USER" -v vetcat_password="$$VETCAT_DB_PASSWORD" -v vetcat_db="$$VETCAT_DB"
        -v keycloak_user="$$KEYCLOAK_DB_USER" -v keycloak_password="$$KEYCLOAK_DB_PASSWORD" -v keycloak_db="$$KEYCLOAK_DB"
        -f /sql/init.sql

  # Aplica las migraciones del catálogo. No arranca con `up -d`: se ejecuta con
  # `docker compose run --rm migraciones`, y la API nunca migra
  # (docs/Despliegue_y_operacion.md §5).
  migraciones:
    image: flyway/flyway:11.14.1-alpine
    restart: "no"
    command: ["migrate"]
    # Con perfil, `up -d` no lo arranca: solo corre cuando se pide con
    # `docker compose run --rm migraciones`. Si fallara dentro de `up -d`, el
    # stack quedaría arriba con la base sin migrar y el error escondido.
    profiles: ["migraciones"]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${VETCAT_DB}
      FLYWAY_USER: ${VETCAT_DB_USER}
      FLYWAY_PASSWORD: ${VETCAT_DB_PASSWORD}
      FLYWAY_SCHEMAS: catalogo
      # La ubicación de tenant llega con el bucle de migración por clínica
      # (fase 2); hoy solo existe la del catálogo.
      FLYWAY_LOCATIONS: filesystem:/flyway/catalogo
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ../../database/migrations/catalogo:/flyway/catalogo:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    # `start-dev` es deliberado y solo vale para local: sirve HTTP sin TLS y
    # desactiva la comprobación estricta del hostname. En nube hace falta
    # `start` con `KC_HOSTNAME` y TLS, y eso se configura en el PR de despliegue,
    # no aquí: hoy no existe entorno de nube.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Correo de pruebas: Keycloak envía por el SMTP de Mailpit, que resuelve
      # por nombre de servicio dentro del compose. Sin credenciales reales.
      # No son opciones de Keycloak: las lee `realm-vetcat.json` como
      # `${KC_SMTP_HOST}` al importar el realm (`smtpServer`).
      KC_SMTP_HOST: mailpit
      KC_SMTP_PORT: "1025"
      KC_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-no-reply@vetcat.dev}
      # `redirect_uri` y origen de los dos clientes públicos del realm
      # (ADR-0004). Cambian por entorno; el realm los lee al importarse.
      VETCAT_APP_REDIRECT_URI: ${VETCAT_APP_REDIRECT_URI:-vetcat://callback}
      VETCAT_ADMIN_ORIGIN: ${VETCAT_ADMIN_ORIGIN:-http://localhost:8081}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-9002}:9000"
    volumes:
      # Solo lectura: el export del realm vive en el repositorio y se importa al
      # arrancar. Sin usuarios y sin secretos (docs/Despliegue_y_operacion.md §12).
      - ../keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Buzón de correo de pruebas: captura la recuperación de contraseña y las
  # invitaciones sin un SMTP real. Solo desarrollo; en nube se configura un
  # servidor SMTP real en Keycloak (docs/Despliegue_y_operacion.md §3).
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
    ports:
      # SMTP se usa solo dentro del compose; la UI se publica en localhost.
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:9.8
    restart: unless-stopped
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # Solo en la máquina del desarrollador: nunca se publica fuera
      # (docs/Despliegue_y_operacion.md §1 y AGENTS.md).
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmindata:
