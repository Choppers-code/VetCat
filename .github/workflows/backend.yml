name: backend

# Build y pruebas del backend cuando exista codigo. Hoy no hay modulo
# backend, asi que el path filter mantiene el job dormido hasta que se anada.
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  build:
    name: build y pruebas
    # Mientras no exista el modulo backend, el job se omite en vez de fallar
    # en cd backend. Se activa cuando llegue el primer PR que lo crea.
    if: hashFiles('backend/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build y pruebas con Gradle
        run: cd backend && ./gradlew build --no-daemon
