name: backend

# Build y pruebas del backend cuando exista código. Hoy no hay módulo backend,
# así que el path filter mantiene el job dormido hasta que se añada el primero.
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [develop]
    # Sin este filtro, el job correría en cada fusión a develop aunque no
    # hubiera código de backend, y fallaría en `cd backend`.
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  build:
    name: build y pruebas
    # Mientras no exista el módulo backend, el job se omite en vez de fallar
    # en `cd backend`. Se activa solo cuando llegue el primer PR que lo crea.
    if: hashFiles('backend/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build y pruebas con Gradle
        run: cd backend && ./gradlew build --no-daemon
