name: frontend

# El check `analyze y test` es obligatorio en develop, así que se reporta
# siempre; el trabajo pesado solo corre si el PR toca el frontend. Así un PR
# de backend no paga un `flutter analyze` (docs/Flujo_de_trabajo.md §5).
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  flutter:
    name: analyze y test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Toca el frontend?
        id: toca
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "FETCH_HEAD...HEAD" \
              | grep -Eq '^(frontend/|\.github/workflows/frontend\.yml)'; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en frontend: el check se cumple sin analizar."
          fi

      - name: Instalar Flutter 3.47.2
        if: steps.toca.outputs.hay == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Comprobar la version fijada
        if: steps.toca.outputs.hay == 'true'
        run: flutter --version

      # Los generados de freezed y json_serializable se commitean (#237). Este paso
      # los regenera y falla si el árbol cambia: un modelo modificado sin
      # regenerar o un `.g.dart` editado a mano. No genera nada para compilar: el
      # APK y la web siguen usando lo commiteado. Las versiones de los
      # generadores salen del `pubspec.lock` de core, para que un PR limpio no se
      # ponga rojo cuando salga una versión nueva de freezed (#247).
      - name: Comprobar que los generados están al día
        if: steps.toca.outputs.hay == 'true'
        run: |
          set -euo pipefail
          cd frontend/packages/core
          flutter pub get --enforce-lockfile
          dart run build_runner build
          cambios=$(git status --porcelain --untracked-files=all -- .)
          if [ -n "$cambios" ]; then
            echo "::error::Los archivos generados no están al día con los modelos."
            echo "$cambios"
            git --no-pager diff --stat -- .
            echo "Regenera y commitea: cd frontend/packages/core && dart run build_runner build"
            exit 1
          fi
          echo "Generados al día."

      # El orden importa: core y ui son dependencias por ruta de las apps.
      - name: Analizar y probar los cuatro proyectos
        if: steps.toca.outputs.hay == 'true'
        run: |
          set -euo pipefail
          for proyecto in \
            frontend/packages/core \
            frontend/packages/ui \
            frontend/apps/vetcat_app \
            frontend/apps/vetcat_admin; do
            echo "=== $proyecto ==="
            (cd "$proyecto" && flutter pub get && flutter analyze && flutter test)
          done

      - name: Compilar la consola web
        if: steps.toca.outputs.hay == 'true'
        run: cd frontend/apps/vetcat_admin && flutter build web --release
