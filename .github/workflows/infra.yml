name: infra

# El check `compose válido` es obligatorio en develop, así que se reporta
# siempre; el trabajo pesado solo corre si el PR toca infraestructura, base de
# datos o la tabla de variables (docs/Flujo_de_trabajo.md §5).
on:
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    name: compose válido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Toca infraestructura o documentación de despliegue?
        id: toca
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "FETCH_HEAD...HEAD" \
              | grep -Eq '^(infrastructure/|database/|docs/Despliegue_y_operacion\.md|\.github/workflows/infra\.yml)'; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios de infraestructura: el check se cumple sin validar."
          fi

      # `docker compose config` no falla cuando falta una variable: avisa,
      # sustituye por vacío y sale con 0. Por eso se mira la salida además del
      # código de salida; si no, el CI estaría verde con el contrato roto.
      - name: Validar el compose y el contrato de variables
        if: steps.toca.outputs.hay == 'true'
        run: |
          set -o pipefail
          if ! salida=$(docker compose \
              -f infrastructure/docker/compose.yaml \
              --env-file infrastructure/docker/.env.example \
              config -q 2>&1); then
            echo "::error::El compose no se puede construir."
            printf '%s\n' "$salida"
            exit 1
          fi
          if printf '%s' "$salida" | grep -qi 'variable is not set'; then
            echo "::error::.env.example no declara todas las variables que usa el compose."
            printf '%s\n' "$salida"
            exit 1
          fi
          echo "Compose válido y contrato de variables completo."

      # `config` tampoco comprueba que el origen de un bind mount exista: si la
      # carpeta se mueve, Docker la crea vacía y Flyway termina "sin migraciones".
      - name: Comprobar que los montajes existen
        if: steps.toca.outputs.hay == 'true'
        run: |
          montajes=$(docker compose \
            -f infrastructure/docker/compose.yaml \
            --env-file infrastructure/docker/.env.example \
            config --format json |
            jq -r '.services[].volumes[]? | select(.type == "bind") | .source')
          echo "$montajes"
          while IFS= read -r ruta; do
            [ -z "$ruta" ] && continue
            if [ ! -e "$ruta" ]; then
              echo "::error::El compose monta '$ruta', que no existe."
              exit 1
            fi
          done <<<"$montajes"
          echo "Todos los montajes existen."

      # La tabla de variables de Despliegue_y_operacion.md §3 repite el
      # contrato de .env.example. Si alguien añade una variable y no la
      # documenta, este paso lo detecta en vez de dejar la tabla callada.
      - name: Comparar .env.example con la tabla de variables
        if: steps.toca.outputs.hay == 'true'
        run: |
          set -euo pipefail
          entorno=$(grep -oE '^[A-Z][A-Z0-9_]*=' infrastructure/docker/.env.example \
            | tr -d '=' | sort -u)
          # Solo la sección 3 (tabla de variables); la sección siguiente usa
          # comillas invertidas para otros valores, como `redirect_uri`.
          tabla=$(sed -n '/^\*\*Variables de entorno\.\*\*/,/^\*\*Puertos\.\*\*/p' \
            docs/Despliegue_y_operacion.md \
            | grep -oE '^\| `[A-Z][A-Z0-9_]*`' \
            | tr -d '|` ' | sort -u)
          echo "=== variables en .env.example ==="
          echo "$entorno"
          echo "=== variables en la tabla de documentación ==="
          echo "$tabla"
          if [ "$entorno" != "$tabla" ]; then
            echo "::error::.env.example y la tabla de variables de Despliegue_y_operacion.md no coinciden."
            echo "Solo en .env.example:"; comm -23 <(echo "$entorno") <(echo "$tabla")
            echo "Solo en la tabla:"; comm -13 <(echo "$entorno") <(echo "$tabla")
            exit 1
          fi
          echo "Contrato de variables documentado al completo."
