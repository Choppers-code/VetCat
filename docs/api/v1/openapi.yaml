openapi: 3.1.0
info:
  title: VetCat API
  version: 0.1.0
  description: >-
    Contrato base de la API de VetCat. Todas las respuestas, incluidos los
    errores, usan el mismo sobre. El tenant nunca viaja en la petición: se
    deriva del JWT firmado (Decisiones_tecnicas.md §2).
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Comprobación de salud del servicio.
      operationId: health
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /propietarios:
    post:
      summary: Registrar un propietario (PRO-001).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. Devuelve 409 si ya
        existe un propietario con el mismo teléfono y la petición no trae
        confirmarDuplicado. La dirección solo se acepta si el plan incluye
        visitas_domicilio (422 en caso contrario).
      operationId: registrarPropietario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropietarioRequest'
      responses:
        '201':
          $ref: '#/components/responses/PropietarioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /propietarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Ficha del propietario con sus mascotas activas (PRO-002).
      description: 'Roles: clinica_admin, recepcionista, veterinario.'
      operationId: consultarPropietario
      responses:
        '200':
          $ref: '#/components/responses/PropietarioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      summary: Editar los datos de un propietario (PRO-002).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. Devuelve 409 si el
        teléfono nuevo ya es de otro propietario y la petición no trae
        confirmarDuplicado.
      operationId: editarPropietario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropietarioRequest'
      responses:
        '200':
          $ref: '#/components/responses/PropietarioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /propietarios/{id}/baja:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Dar de baja a un propietario y a sus mascotas (PRO-004).
      description: >-
        Rol: clinica_admin. Nada se borra. Devuelve 409 con las citas futuras
        si las hay, y no da de baja.
      operationId: darDeBajaPropietario
      responses:
        '200':
          $ref: '#/components/responses/PropietarioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /propietarios/{id}/reactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Reactivar un propietario; sus mascotas no se reactivan (PRO-004).
      description: 'Rol: clinica_admin.'
      operationId: reactivarPropietario
      responses:
        '200':
          $ref: '#/components/responses/PropietarioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /mascotas:
    post:
      summary: Registrar una mascota de un propietario (PRO-005).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. 422 por fecha futura,
        peso no positivo o especie fuera de la lista; 404 si el propietario es
        de otra clínica o está inactivo.
      operationId: registrarMascota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MascotaRequest'
      responses:
        '201':
          $ref: '#/components/responses/MascotaFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /mascotas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Ficha de datos generales de la mascota (PRO-006).
      description: 'Roles: clinica_admin, recepcionista, veterinario.'
      operationId: consultarMascota
      responses:
        '200':
          $ref: '#/components/responses/MascotaFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      summary: Editar una mascota; el propietario no cambia (PRO-008).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. El cuerpo no admite
        propietarioId.
      operationId: editarMascota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MascotaActualizacionRequest'
      responses:
        '200':
          $ref: '#/components/responses/MascotaFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /mascotas/{id}/baja:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Dar de baja a una mascota (PRO-004).
      description: 'Rol: clinica_admin. 409 con las citas futuras si las hay.'
      operationId: darDeBajaMascota
      responses:
        '200':
          $ref: '#/components/responses/MascotaFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /mascotas/{id}/reactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Reactivar una mascota cuyo propietario está activo (PRO-004).
      description: 'Rol: clinica_admin.'
      operationId: reactivarMascota
      responses:
        '200':
          $ref: '#/components/responses/MascotaFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /citas:
    get:
      summary: Consultar la agenda por rango (AGE-012).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. Los tres pueden
        consultar y filtrar la agenda de la clínica; para veterinario la lectura
        es de solo consulta. Los filtros no amplían el acceso fuera de la clínica
        activa. Las fechas se interpretan en su zona horaria.
      operationId: consultarAgenda
      parameters:
        - name: desde
          in: query
          required: true
          description: Inicio del rango, en la zona horaria de la clínica.
          schema:
            type: string
            format: date-time
        - name: veterinarioId
          in: query
          required: false
          description: Filtro de agenda por veterinario.
          schema:
            type: integer
            format: int64
        - name: consultorioId
          in: query
          required: false
          description: Filtro de agenda por consultorio.
          schema:
            type: integer
            format: int64
        - name: hasta
          in: query
          required: true
          description: Fin exclusivo del rango, en la zona horaria de la clínica.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          $ref: '#/components/responses/Agenda'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/EntradaInvalida'
    post:
      summary: Crear una cita en consultorio (AGE-001, AGE-002, AGE-003).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. La cita nace
        PENDIENTE. El veterinario solo puede crear citas en su propia agenda.
        Devuelve 409 si la restricción de exclusión detecta un empalme y 422
        si la franja está fuera de horario, bloqueada o los datos no pertenecen
        a la clínica activa. La zona horaria se obtiene de la clínica.
      operationId: crearCita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitaRequest'
      responses:
        '201':
          $ref: '#/components/responses/CitaFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /consultorios:
    get:
      summary: Consultar los consultorios de la clínica.
      description: >-
        Roles: clinica_admin, veterinario y recepcionista. La lectura no permite
        modificar: crear, editar o dar de baja sigue siendo de clinica_admin.
      operationId: listarConsultorios
      responses:
        '200':
          $ref: '#/components/responses/Consultorios'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      summary: Registrar un consultorio (AGE-012).
      description: 'Rol: clinica_admin.'
      operationId: registrarConsultorio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultorioRequest'
      responses:
        '201':
          $ref: '#/components/responses/ConsultorioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /consultorios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Editar un consultorio.
      description: 'Rol: clinica_admin.'
      operationId: editarConsultorio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultorioRequest'
      responses:
        '200':
          $ref: '#/components/responses/ConsultorioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /horarios:
    get:
      summary: Consultar horarios de consultorio (AGE-013).
      description: >-
        Roles: clinica_admin, veterinario y recepcionista. La lectura no permite
        modificar; gestionar los horarios sigue siendo de clinica_admin. Las
        horas se interpretan en la zona horaria de la clínica; una excepción por
        fecha sustituye el horario semanal de ese consultorio para ese día.
      operationId: consultarHorarios
      parameters:
        - name: consultorioId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/Horarios'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      summary: Registrar un horario semanal o una excepción por fecha.
      description: 'Rol: clinica_admin. Las horas se interpretan en la zona de la clínica.'
      operationId: registrarHorario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HorarioRequest'
      responses:
        '201':
          $ref: '#/components/responses/HorarioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /horarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Editar un horario semanal o una excepción por fecha.
      description: 'Rol: clinica_admin. Las horas se interpretan en la zona de la clínica.'
      operationId: editarHorario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HorarioRequest'
      responses:
        '200':
          $ref: '#/components/responses/HorarioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /bloqueos:
    get:
      summary: Consultar bloqueos de agenda.
      description: >-
        Roles: clinica_admin, recepcionista y veterinario. La recepción ve los
        bloqueos de toda la clínica; el veterinario solo los suyos: si omite
        veterinarioId se filtra a su agenda, y si lo envía debe coincidir con su
        identidad o se responde 403.
      operationId: consultarBloqueos
      parameters:
        - name: desde
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: consultorioId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: veterinarioId
          in: query
          required: false
          description: >-
            Filtro de clinica_admin y recepción. Para veterinario debe coincidir
            con su identidad; nunca permite consultar a otro.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/Bloqueos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/EntradaInvalida'
    post:
      summary: Registrar un bloqueo por veterinario o consultorio (AGE-002).
      description: >-
        Roles: clinica_admin y veterinario. Un veterinario solo puede bloquear
        su propia agenda y debe indicar su veterinarioId; solo clinica_admin
        puede bloquear por consultorio o la agenda de otro veterinario. Los
        intervalos usan la zona horaria de la clínica; no se modifican las citas
        existentes.
      operationId: registrarBloqueo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueoRequest'
      responses:
        '201':
          $ref: '#/components/responses/BloqueoFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /busqueda:
    get:
      summary: Buscar propietarios y mascotas sin acentos ni mayúsculas (PRO-009).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. incluirInactivos solo
        lo admite clinica_admin (403 para los demás). 422 si q tiene menos de 3
        caracteres.
      operationId: buscar
      parameters:
        - name: q
          in: query
          required: true
          description: Texto a buscar, de 3 caracteres o más.
          schema:
            type: string
            minLength: 3
        - name: incluirInactivos
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/Busqueda'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      description: Página a devolver, empezando en 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Tamaño de la página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Respuesta:
      type: object
      description: Sobre uniforme, usado también en errores.
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Contenido de la respuesta; null cuando no lo hay.
      additionalProperties: false

    Error:
      type: object
      description: Cuerpo de error del sobre (success=false, data=null).
      required: [success, message, data]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
          description: Mensaje comprensible en español, sin trazas ni SQL.
        data:
          type: 'null'

    Paginacion:
      type: object
      required: [contenido, pagina, tamano, total]
      properties:
        contenido:
          type: array
          items: {}
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer

    PropietarioRequest:
      type: object
      required: [nombre, telefono]
      properties:
        nombre: {type: string, maxLength: 150}
        telefono: {type: string, maxLength: 30}
        correo: {type: string, format: email}
        direccion:
          type: string
          maxLength: 300
          description: Solo si el plan incluye visitas_domicilio.
        confirmarDuplicado:
          type: boolean
          default: false
          description: Guarda la ficha aunque otro propietario ya tenga ese teléfono.

    PropietarioResponse:
      type: object
      required: [id, nombre, telefono, activo, mascotas]
      properties:
        id: {type: integer, format: int64}
        nombre: {type: string}
        telefono: {type: string}
        correo: {type: string}
        direccion: {type: string}
        activo: {type: boolean}
        mascotas:
          type: array
          description: Mascotas activas del propietario.
          items:
            $ref: '#/components/schemas/MascotaResponse'

    MascotaDatos:
      type: object
      required: [nombre, especie]
      properties:
        nombre: {type: string, maxLength: 100}
        especie:
          $ref: '#/components/schemas/Especie'
        raza: {type: string, maxLength: 100}
        sexo:
          $ref: '#/components/schemas/Sexo'
        fechaNacimiento:
          type: string
          format: date
          description: No puede ser futura.
        pesoKg: {type: number, exclusiveMinimum: 0, maximum: 9999.99}
        notas: {type: string}

    MascotaRequest:
      description: Datos de la mascota y su propietario, que ya no cambia (PRO-008).
      allOf:
        - $ref: '#/components/schemas/MascotaDatos'
        - type: object
          required: [propietarioId]
          properties:
            propietarioId:
              type: integer
              format: int64

    MascotaActualizacionRequest:
      description: Igual que MascotaDatos; no admite propietarioId.
      allOf:
        - $ref: '#/components/schemas/MascotaDatos'
        - type: object
          not:
            required: [propietarioId]

    MascotaResponse:
      type: object
      required: [id, propietarioId, nombre, especie, activo]
      properties:
        id: {type: integer, format: int64}
        propietarioId: {type: integer, format: int64}
        nombre: {type: string}
        especie:
          $ref: '#/components/schemas/Especie'
        raza: {type: string}
        sexo:
          $ref: '#/components/schemas/Sexo'
        fechaNacimiento: {type: string, format: date}
        pesoKg: {type: number}
        notas: {type: string}
        activo: {type: boolean}

    Especie:
      type: string
      enum: [PERRO, GATO, AVE, ROEDOR, REPTIL, OTRA]

    Sexo:
      type: string
      enum: [MACHO, HEMBRA, DESCONOCIDO]

    ResultadoBusqueda:
      type: object
      required: [propietario]
      properties:
        propietario:
          $ref: '#/components/schemas/PropietarioResponse'
        mascota:
          $ref: '#/components/schemas/MascotaResponse'

    CitaRequest:
      type: object
      required: [mascotaId, veterinarioId, consultorioId, inicio, duracionMinutos]
      properties:
        mascotaId: {type: integer, format: int64}
        veterinarioId: {type: integer, format: int64}
        consultorioId: {type: integer, format: int64}
        inicio:
          type: string
          format: date-time
          description: Fecha y hora de inicio con desplazamiento; se valida en la zona de la clínica.
        duracionMinutos:
          type: integer
          minimum: 1
          maximum: 1440
          description: >-
            Duración obligatoria en minutos (1 a 1440). El fin se calcula como
            inicio más esta duración; no depende de una configuración en
            catalogo.clinica.
        motivo: {type: string, maxLength: 500}

    CitaResponse:
      type: object
      required: [id, mascotaId, veterinarioId, tipo, consultorioId, inicio, fin, estado]
      properties:
        id: {type: integer, format: int64}
        mascotaId: {type: integer, format: int64}
        veterinarioId: {type: integer, format: int64}
        tipo:
          type: string
          enum: [CONSULTORIO, DOMICILIO]
        consultorioId:
          type: [integer, 'null']
          format: int64
        inicio: {type: string, format: date-time}
        fin: {type: string, format: date-time}
        estado:
          type: string
          enum: [PENDIENTE, CONFIRMADA, ATENDIDA, NO_ASISTIO, CANCELADA]
        motivo: {type: string}

    ConsultorioRequest:
      type: object
      required: [nombre]
      properties:
        nombre: {type: string, minLength: 1, maxLength: 100}
        activo:
          type: boolean
          default: true
          description: false da de baja lógicamente el consultorio.

    ConsultorioResponse:
      type: object
      required: [id, nombre, activo]
      properties:
        id: {type: integer, format: int64}
        nombre: {type: string}
        activo: {type: boolean}

    HorarioRequest:
      type: object
      required: [consultorioId, esCierre]
      properties:
        consultorioId: {type: integer, format: int64}
        esCierre:
          type: boolean
          description: >-
            Si es true, el horario cierra el consultorio en el día indicado y
            no requiere horaInicio ni horaFin.
        activo:
          type: boolean
          default: true
          description: false desactiva el horario o la excepción.
        diaSemana:
          type: integer
          minimum: 1
          maximum: 7
          description: Día semanal ISO-8601 (1 lunes, 7 domingo); excluyente con fecha.
        fecha:
          type: string
          format: date
          description: Excepción para esta fecha, que sustituye el horario semanal.
        horaInicio:
          type: [string, 'null']
        horaFin:
          type: [string, 'null']
      oneOf:
        - required: [diaSemana]
          not:
            required: [fecha]
        - required: [fecha]
          not:
            required: [diaSemana]
      allOf:
        - if:
            properties:
              esCierre:
                const: false
          then:
            required: [horaInicio, horaFin]
            properties:
              horaInicio: {type: string, format: time}
              horaFin: {type: string, format: time}
        - if:
            properties:
              esCierre:
                const: true
          then:
            properties:
              horaInicio: {type: 'null'}
              horaFin: {type: 'null'}

    HorarioResponse:
      type: object
      required: [id, consultorioId, esCierre, activo]
      properties:
        id: {type: integer, format: int64}
        consultorioId: {type: integer, format: int64}
        esCierre: {type: boolean}
        activo: {type: boolean}
        diaSemana: {type: integer, minimum: 1, maximum: 7}
        fecha: {type: string, format: date}
        horaInicio: {type: [string, 'null']}
        horaFin: {type: [string, 'null']}
      allOf:
        - if:
            properties:
              esCierre:
                const: false
          then:
            required: [horaInicio, horaFin]
            properties:
              horaInicio: {type: string, format: time}
              horaFin: {type: string, format: time}
        - if:
            properties:
              esCierre:
                const: true
          then:
            properties:
              horaInicio: {type: 'null'}
              horaFin: {type: 'null'}

    BloqueoRequest:
      type: object
      required: [inicio, fin, motivo]
      properties:
        veterinarioId: {type: integer, format: int64}
        consultorioId: {type: integer, format: int64}
        inicio:
          type: string
          format: date-time
          description: Inicio inclusivo en la zona horaria de la clínica.
        fin:
          type: string
          format: date-time
          description: Fin exclusivo en la zona horaria de la clínica.
        motivo: {type: string, minLength: 1, maxLength: 500}
      oneOf:
        - required: [veterinarioId]
          not:
            required: [consultorioId]
        - required: [consultorioId]
          not:
            required: [veterinarioId]

    BloqueoResponse:
      type: object
      required: [id, inicio, fin, motivo]
      properties:
        id: {type: integer, format: int64}
        veterinarioId: {type: integer, format: int64}
        consultorioId: {type: integer, format: int64}
        inicio: {type: string, format: date-time}
        fin: {type: string, format: date-time}
        motivo: {type: string}


