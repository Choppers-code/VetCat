openapi: 3.1.0
info:
  title: VetCat API
  version: 0.1.0
  description: >-
    Contrato base de la API de VetCat. Todas las respuestas, incluidos los
    errores, usan el mismo sobre. El tenant nunca viaja en la petición: se
    deriva del JWT firmado (Decisiones_tecnicas.md §2).
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Comprobación de salud del servicio.
      operationId: health
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /propietarios:
    post:
      summary: Registrar un propietario (PRO-001).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. Devuelve 409 si ya
        existe un propietario con el mismo teléfono y la petición no trae
        confirmarDuplicado. La dirección solo se acepta si el plan incluye
        visitas_domicilio (422 en caso contrario).
      operationId: registrarPropietario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropietarioRequest'
      responses:
        '201':
          $ref: '#/components/responses/PropietarioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /propietarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Ficha del propietario con sus mascotas activas (PRO-002).
      description: 'Roles: clinica_admin, recepcionista, veterinario.'
      operationId: consultarPropietario
      responses:
        '200':
          $ref: '#/components/responses/PropietarioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      summary: Editar los datos de un propietario (PRO-002).
      description: 'Roles: clinica_admin, recepcionista, veterinario.'
      operationId: editarPropietario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropietarioRequest'
      responses:
        '200':
          $ref: '#/components/responses/PropietarioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /propietarios/{id}/baja:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Dar de baja a un propietario y a sus mascotas (PRO-004).
      description: >-
        Rol: clinica_admin. Nada se borra. Devuelve 409 con las citas futuras
        si las hay, y no da de baja.
      operationId: darDeBajaPropietario
      responses:
        '200':
          $ref: '#/components/responses/PropietarioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /propietarios/{id}/reactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Reactivar un propietario; sus mascotas no se reactivan (PRO-004).
      description: 'Rol: clinica_admin.'
      operationId: reactivarPropietario
      responses:
        '200':
          $ref: '#/components/responses/PropietarioFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /mascotas:
    post:
      summary: Registrar una mascota de un propietario (PRO-005).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. 422 por fecha futura,
        peso no positivo o especie fuera de la lista; 404 si el propietario es
        de otra clínica o está inactivo.
      operationId: registrarMascota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MascotaRequest'
      responses:
        '201':
          $ref: '#/components/responses/MascotaFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /mascotas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Ficha de datos generales de la mascota (PRO-006).
      description: 'Roles: clinica_admin, recepcionista, veterinario.'
      operationId: consultarMascota
      responses:
        '200':
          $ref: '#/components/responses/MascotaFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      summary: Editar una mascota; el propietario no cambia (PRO-008).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. El cuerpo no admite
        propietarioId.
      operationId: editarMascota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MascotaActualizacionRequest'
      responses:
        '200':
          $ref: '#/components/responses/MascotaFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /mascotas/{id}/baja:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Dar de baja a una mascota (PRO-004).
      description: 'Rol: clinica_admin. 409 con las citas futuras si las hay.'
      operationId: darDeBajaMascota
      responses:
        '200':
          $ref: '#/components/responses/MascotaFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /mascotas/{id}/reactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Reactivar una mascota cuyo propietario está activo (PRO-004).
      description: 'Rol: clinica_admin.'
      operationId: reactivarMascota
      responses:
        '200':
          $ref: '#/components/responses/MascotaFicha'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /citas:
    get:
      summary: Consultar la agenda en un rango de fechas (AGE-012).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. Las fechas se
        interpretan en la zona horaria de la clínica; el veterinario ve su
        agenda por defecto.
      operationId: consultarAgenda
      parameters:
        - name: desde
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: hasta
          in: query
          required: true
          schema: {type: string, format: date-time}
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/EntradaInvalida'
    post:
      summary: Crear una cita (AGE-001, AGE-003, AGE-016).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. La cita queda
        PENDIENTE. Devuelve 409 si se empalma con una cita no cancelada y 422
        si queda fuera del horario, dentro de un bloqueo o el plan no permite
        visitas a domicilio.
      operationId: crearCita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitaRequest'
      responses:
        '201':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /citas/solicitudes:
    post:
      summary: Solicitar una cita para una mascota propia (AGE-017, AGE-018).
      description: >-
        Rol: cliente. La cita queda PENDIENTE; máximo 3 solicitudes pendientes
        por cliente. Solo admite citas en consultorio.
      operationId: solicitarCita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCitaRequest'
      responses:
        '201':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /citas/{id}/confirmar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Confirmar una cita pendiente (AGE-004).
      description: 'Rol: veterinario asignado.'
      operationId: confirmarCita
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /citas/{id}/atender:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Marcar como atendida una cita con consulta (AGE-011).
      description: 'Rol: veterinario asignado.'
      operationId: atenderCita
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /citas/{id}/no-asistio:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Marcar que la mascota no asistió (AGE-010).
      description: 'Rol: veterinario asignado; solo después de la hora de inicio.'
      operationId: marcarCitaNoAsistio
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /citas/{id}/cancelar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Cancelar una cita con motivo (AGE-007).
      description: 'Roles: clinica_admin, recepcionista, veterinario.'
      operationId: cancelarCita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarCitaRequest'
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /citas/{id}/reprogramar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Reprogramar una cita creando otra pendiente (AGE-006).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. La cita nueva apunta
        a la original mediante reprogramadaDe y vuelve a confirmarse.
      operationId: reprogramarCita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitaRequest'
      responses:
        '201':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /citas/{id}/solicitud-cancelacion:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Solicitar la cancelación de una cita (AGE-008).
      description: >-
        Rol: cliente propietario de la mascota. Requiere al menos 5 horas
        antes del inicio; la cita conserva su estado mientras se resuelve.
      operationId: solicitarCancelacionCita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarCitaRequest'
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /consultorios:
    get:
      summary: Consultar consultorios de la clínica.
      description: 'Roles: clinica_admin, recepcionista, veterinario.'
      operationId: consultarConsultorios
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      summary: Crear un consultorio.
      description: 'Rol: clinica_admin.'
      operationId: crearConsultorio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultorioRequest'
      responses:
        '201':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /consultorios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Editar un consultorio.
      description: 'Rol: clinica_admin.'
      operationId: editarConsultorio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultorioRequest'
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /horarios:
    get:
      summary: Consultar horarios de consultorio, incluidos los cambios por fecha.
      description: 'Roles: clinica_admin, recepcionista, veterinario.'
      operationId: consultarHorariosConsultorio
      parameters:
        - name: consultorioId
          in: query
          required: false
          schema: {type: integer, format: int64}
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      summary: Crear un horario semanal o una excepción por fecha.
      description: 'Rol: clinica_admin.'
      operationId: crearHorarioConsultorio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HorarioConsultorioRequest'
      responses:
        '201':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /horarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Editar un horario semanal o una excepción.
      description: 'Rol: clinica_admin.'
      operationId: editarHorarioConsultorio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HorarioConsultorioRequest'
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /bloqueos:
    get:
      summary: Consultar bloqueos de agenda.
      description: >-
        Roles: clinica_admin, veterinario. El veterinario solo consulta los
        bloqueos de su propia agenda.
      operationId: consultarBloqueosAgenda
      responses:
        '200':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      summary: Crear un bloqueo de agenda.
      description: >-
        Roles: clinica_admin, veterinario. El veterinario solo bloquea su
        propia agenda.
      operationId: crearBloqueoAgenda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueoAgendaRequest'
      responses:
        '201':
          $ref: '#/components/responses/JsonExito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

  /busqueda:
    get:
      summary: Buscar propietarios y mascotas sin acentos ni mayúsculas (PRO-009).
      description: >-
        Roles: clinica_admin, recepcionista, veterinario. incluirInactivos solo
        lo admite clinica_admin (403 para los demás). 422 si q tiene menos de 3
        caracteres.
      operationId: buscar
      parameters:
        - name: q
          in: query
          required: true
          description: Texto a buscar, de 3 caracteres o más.
          schema:
            type: string
            minLength: 3
        - name: incluirInactivos
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/Busqueda'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/EntradaInvalida'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      description: Página a devolver, empezando en 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Tamaño de la página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Respuesta:
      type: object
      description: Sobre uniforme, usado también en errores.
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Contenido de la respuesta; null cuando no lo hay.
      additionalProperties: false

    Error:
      type: object
      description: Cuerpo de error del sobre (success=false, data=null).
      required: [success, message, data]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
          description: Mensaje comprensible en español, sin trazas ni SQL.
        data:
          type: 'null'

    Paginacion:
      type: object
      required: [contenido, pagina, tamano, total]
      properties:
        contenido:
          type: array
          items: {}
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer

    PropietarioRequest:
      type: object
      required: [nombre, telefono]
      properties:
        nombre: {type: string, maxLength: 150}
        telefono: {type: string, maxLength: 30}
        correo: {type: string, format: email}
        direccion:
          type: string
          maxLength: 300
          description: Solo si el plan incluye visitas_domicilio.
        confirmarDuplicado:
          type: boolean
          default: false
          description: Crea el propietario aunque el teléfono ya exista.

    PropietarioResponse:
      type: object
      required: [id, nombre, telefono, activo, mascotas]
      properties:
        id: {type: integer, format: int64}
        nombre: {type: string}
        telefono: {type: string}
        correo: {type: string}
        direccion: {type: string}
        activo: {type: boolean}
        mascotas:
          type: array
          description: Mascotas activas del propietario.
          items:
            $ref: '#/components/schemas/MascotaResponse'

    MascotaDatos:
      type: object
      required: [nombre, especie]
      properties:
        nombre: {type: string, maxLength: 100}
        especie:
          $ref: '#/components/schemas/Especie'
        raza: {type: string, maxLength: 100}
        sexo:
          $ref: '#/components/schemas/Sexo'
        fechaNacimiento:
          type: string
          format: date
          description: No puede ser futura.
        pesoKg: {type: number, exclusiveMinimum: 0, maximum: 9999.99}
        notas: {type: string}

    MascotaRequest:
      description: Datos de la mascota y su propietario, que ya no cambia (PRO-008).
      allOf:
        - $ref: '#/components/schemas/MascotaDatos'
        - type: object
          required: [propietarioId]
          properties:
            propietarioId:
              type: integer
              format: int64

    MascotaActualizacionRequest:
      description: Igual que MascotaDatos; no admite propietarioId.
      allOf:
        - $ref: '#/components/schemas/MascotaDatos'
        - type: object
          not:
            required: [propietarioId]

    MascotaResponse:
      type: object
      required: [id, propietarioId, nombre, especie, activo]
      properties:
        id: {type: integer, format: int64}
        propietarioId: {type: integer, format: int64}
        nombre: {type: string}
        especie:
          $ref: '#/components/schemas/Especie'
        raza: {type: string}
        sexo:
          $ref: '#/components/schemas/Sexo'
        fechaNacimiento: {type: string, format: date}
        pesoKg: {type: number}
        notas: {type: string}
        activo: {type: boolean}

    Especie:
      type: string
      enum: [PERRO, GATO, AVE, ROEDOR, REPTIL, OTRA]

    Sexo:
      type: string
      enum: [MACHO, HEMBRA, DESCONOCIDO]

    ResultadoBusqueda:
      type: object
      required: [propietario]
      properties:
        propietario:
          $ref: '#/components/schemas/PropietarioResponse'
        mascota:
          $ref: '#/components/schemas/MascotaResponse'

    CitaRequest:
      type: object
      required: [mascotaId, veterinarioId, tipo, inicio, fin]
      properties:
        mascotaId: {type: integer, format: int64}
        veterinarioId: {type: integer, format: int64}
        tipo:
          type: string
          enum: [CONSULTORIO, DOMICILIO]
        consultorioId:
          type: integer
          format: int64
          description: Obligatorio para tipo CONSULTORIO y no permitido para DOMICILIO.
        direccion:
          type: string
          maxLength: 300
          description: Obligatoria para tipo DOMICILIO.
        inicio: {type: string, format: date-time}
        fin: {type: string, format: date-time}
        motivo: {type: string}

    SolicitudCitaRequest:
      type: object
      required: [mascotaId, veterinarioId, consultorioId, inicio, fin]
      properties:
        mascotaId: {type: integer, format: int64}
        veterinarioId: {type: integer, format: int64}
        consultorioId: {type: integer, format: int64}
        inicio: {type: string, format: date-time}
        fin: {type: string, format: date-time}
        motivo: {type: string}

    CancelarCitaRequest:
      type: object
      required: [motivo]
      properties:
        motivo: {type: string, minLength: 1}

    ConsultorioRequest:
      type: object
      required: [nombre]
      properties:
        nombre: {type: string, minLength: 1, maxLength: 100}

    HorarioConsultorioRequest:
      type: object
      required: [consultorioId, esCierre]
      properties:
        consultorioId: {type: integer, format: int64}
        diaSemana:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO-8601, de lunes (1) a domingo (7), para un horario semanal.
        fechaExcepcion:
          type: string
          format: date
          description: Fecha que sustituye el horario semanal de ese consultorio.
        inicio: {type: string, format: time}
        fin: {type: string, format: time}
        esCierre: {type: boolean}

    BloqueoAgendaRequest:
      type: object
      required: [inicio, fin, motivo]
      properties:
        veterinarioId: {type: integer, format: int64}
        consultorioId: {type: integer, format: int64}
        inicio: {type: string, format: date-time}
        fin: {type: string, format: date-time}
        motivo: {type: string, minLength: 1}
      description: Se debe indicar exactamente uno entre veterinarioId y consultorioId.


  responses:
    PropietarioFicha:
      description: Ficha del propietario.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Respuesta'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PropietarioResponse'
    MascotaFicha:
      description: Ficha de la mascota.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Respuesta'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MascotaResponse'
    Busqueda:
      description: Resultados paginados, con el propietario junto a cada mascota.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Respuesta'
              - type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Paginacion'
                      - type: object
                        properties:
                          contenido:
                            type: array
                            items:
                              $ref: '#/components/schemas/ResultadoBusqueda'
    NoEncontrado:
      description: No existe en la clínica del token (también si es de otra clínica).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    JsonExito:
      description: Operación correcta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Respuesta'
    JsonError:
      description: Error con el sobre uniforme.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Respuesta'
    NoAutenticado:
      description: Falta el JWT o es inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Prohibido:
      description: El rol no permite la operación o el tenant no está activo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Conflicto de horario o folio (restricción de base de datos).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EntradaInvalida:
      description: La entrada no supera la validación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
